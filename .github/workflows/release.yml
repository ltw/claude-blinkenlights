name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build .app
        run: ./build.sh

      - name: Ad-hoc sign
        run: |
          codesign --force --deep --sign - \
            --options runtime \
            ClaudeBlinkenlights.app
          codesign --verify --deep --strict --verbose=2 ClaudeBlinkenlights.app

      - name: Zip bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="ClaudeBlinkenlights-${VERSION}.zip"
          ditto -c -k --keepParent ClaudeBlinkenlights.app "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
          body: |
            Unsigned / ad-hoc-signed build. macOS Gatekeeper will block it on first open.

            **To run:**
            ```
            unzip ClaudeBlinkenlights-*.zip
            xattr -dr com.apple.quarantine ClaudeBlinkenlights.app
            mv ClaudeBlinkenlights.app /Applications/
            open /Applications/ClaudeBlinkenlights.app
            ```

            Or: right-click the `.app` in Finder → **Open** → **Open** in the dialog.
