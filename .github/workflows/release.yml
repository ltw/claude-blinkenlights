name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build universal .app
        run: ./build.sh

      - name: Ad-hoc sign
        run: |
          codesign --force --deep --sign - \
            --options runtime \
            ClaudeBlinkenlights.app
          codesign --verify --deep --strict --verbose=2 ClaudeBlinkenlights.app

      - name: Build DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="ClaudeBlinkenlights-${VERSION}.dmg"
          create-dmg \
            --volname "ClaudeBlinkenlights" \
            --window-size 600 400 \
            --icon-size 128 \
            --icon ClaudeBlinkenlights.app 150 200 \
            --app-drop-link 450 200 \
            --hide-extension ClaudeBlinkenlights.app \
            --no-internet-enable \
            "$DMG" \
            ClaudeBlinkenlights.app
          shasum -a 256 "$DMG" > "$DMG.sha256"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.DMG }}
            ${{ env.DMG }}.sha256
          body: |
            Universal (arm64 + x86_64) ad-hoc-signed build. macOS Gatekeeper will block it on first open.

            **To install:**
            1. Download the `.dmg` and open it.
            2. Drag `ClaudeBlinkenlights.app` onto the `Applications` shortcut.
            3. Launch it from `/Applications`. If Gatekeeper blocks the app, right-click it → **Open** → **Open**, or run:
               ```
               xattr -dr com.apple.quarantine /Applications/ClaudeBlinkenlights.app
               ```
